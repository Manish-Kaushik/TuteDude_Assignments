<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promise Based Divide</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Promise-Based Divide Function</h1>
        <p class="subtitle">JavaScript Promise practice</p>

        <div class="card">
            <label for="firstNumber">First Number</label>
            <input type="number" id="firstNumber" placeholder="Enter first number">

            <label for="secondNumber">Second Number</label>
            <input type="number" id="secondNumber" placeholder="Enter second number">

            <button id="divideBtn">Divide</button>

            <div id="result" class="result">Result will appear here.</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
