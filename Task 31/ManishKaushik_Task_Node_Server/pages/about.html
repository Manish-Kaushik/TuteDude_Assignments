<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About - NodeWeb</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f3ff;
  color: #222;
}
nav {
  background: #64106f;
  padding: 16px 8%;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.logo { color: white; font-size: 22px; font-weight: bold; }
nav a {
  color: white;
  text-decoration: none;
  margin-left: 22px;
}
nav a:hover { text-decoration: underline; }
main {
  max-width: 900px;
  margin: 70px auto;
  padding: 20px;
  text-align: center;
}
.card {
  background: white;
  padding: 40px;
  border-radius: 16px;
  box-shadow: 0 8px 30px #0001;
}
h1 { color: #64106f; font-size: 42px; }
p { line-height: 1.7; color: #555; }
.button {
  display: inline-block;
  margin-top: 15px;
  padding: 12px 20px;
  border-radius: 8px;
  background: #64106f;
  color: white;
  text-decoration: none;
}
footer {
  text-align: center;
  color: #777;
  padding: 20px;
}
</style>
</head>
<body>
<nav>
  <div class="logo">NodeWeb</div>
  <div>
    <a href="/home">Home</a>
    <a href="/about">About</a>
    <a href="/contact">Contact</a>
  </div>
</nav>
<main>
  <div class="card">
    <h1>About Us</h1>
    <p>This is the About route. The server reads this HTML file and sends it when /about is requested.</p>
    
  </div>
</main>
<footer>Simple Node.js HTTP Server • Port 3000</footer>
</body>
</html>
